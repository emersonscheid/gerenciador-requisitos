
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Gerenciador de Requisitos</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="login-container">

        <section class="login-banner">
            <div class="brand">
                <div class="brand-icon">▤</div>
                <h1>Gerenciador de<br>Requisitos de Software</h1>
            </div>

            <p>
                Organize, documente e acompanhe<br>
                os requisitos dos seus projetos<br>
                de forma simples e eficiente.
            </p>
        </section>

        <section class="login-content">
            <div class="login-form">

                <h2>Acesse sua conta</h2>
                <p class="subtitle">
                    Entre com seu e-mail e senha para continuar.
                </p>

                <form id="loginForm">

                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                        required
                    >

                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Sua senha"
                        required
                    >

                    <button type="submit">Entrar →</button>
                    <p class="demo-access">
                        <strong>Acesso para demonstração</strong><br>
                        E-mail: admin@gerenciador.com<br>
                        Senha: 123456
                    </p>
                </form>

            </div>
        </section>

    </main>

    <script src="js/script.js"></script>
</body>
</html>
